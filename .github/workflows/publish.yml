name: Publish

# Builds the zips and the index and deploys them to Pages. Every check the pull request ran is
# run again here: main is what the world downloads, and it can be pushed to directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# The default for every job: read the repository and nothing else. The Pages token is granted to
# the deploy job alone — the build runs a validator over code from a pull request that was
# merged, and a job that can write to Pages should not also be the one reading that.
permissions:
  contents: read

jobs:
  build:
    name: validate and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test

      - run: bun run check-vendor

      # Reads the published index, refuses a version that did not go up, writes dist/.
      - run: bun run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
