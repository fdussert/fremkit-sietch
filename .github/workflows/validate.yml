name: Validate

# What a pull request gets: every rule the publish workflow applies, and nothing written
# anywhere. The two run the same code path, so a pull request that passes here cannot fail on
# merge for a reason its author could have been told about.
on:
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# A fork's pull request gets a read-only token. Nothing in this workflow writes, and the widget
# being validated is code from that fork: it is read, never run.
permissions:
  contents: read

jobs:
  validate:
    name: validate widgets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test

      # The vendored manifest schema must be the one Fremkit released, or this registry
      # publishes widgets the installer refuses.
      - run: bun run check-vendor

      # Reads the index already on Pages, so "the version must go up" is checked before merge.
      - run: bun run validate
