<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Containers</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--on-surface, var(--text, #e6e8eb));
    font-family: var(--font, system-ui, sans-serif);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .wrap { height: 100%; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .summary, .status, .empty { font-size: calc(12px * var(--text-scale, 1)); line-height: 1.3; }
  .summary { color: var(--text-muted, currentColor); }
  .status { border-left: 3px solid var(--accent, currentColor); padding: 4px 8px; }
  .status:empty { display: none; }
  .filters { display: flex; flex-wrap: wrap; max-width: 100%; gap: 3px; padding: 3px; border: 1px solid var(--border, currentColor); border-radius: 10px; }
  .filters button {
    min-height: 44px;
    min-width: 90px;
    padding: 5px 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: calc(13px * var(--text-scale, 1));
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    background: var(--surface-3, var(--border, #303642));
    box-shadow: inset 0 -2px var(--accent, currentColor);
    font-weight: 700;
  }
  .filters button:focus-visible { outline: 3px solid var(--accent, currentColor); outline-offset: 2px; }
  .filters button::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: currentColor; }
  #filter-active::before { background: var(--ok, currentColor); }
  #filter-stopped::before { background: var(--text-muted, currentColor); }
  #filter-all::before { background: var(--accent, currentColor); }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    align-content: start;
    gap: 7px;
    overflow: auto;
    min-height: 0;
  }
  .card { min-width: 0; padding: 9px; border: 1px solid var(--border, currentColor); border-radius: 9px; }
  .name { font-size: calc(16px * var(--text-scale, 1)); font-weight: 650; overflow-wrap: anywhere; }
  .meta { font-size: calc(11px * var(--text-scale, 1)); color: var(--text-muted, currentColor); overflow-wrap: anywhere; }
  .pill {
    display: inline-block;
    max-width: 100%;
    margin: 4px 0;
    padding: 2px 6px;
    border: 1px solid currentColor;
    border-radius: 5px;
    font-size: calc(11px * var(--text-scale, 1));
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }
  .pill.running { color: var(--ok, currentColor); }
  .pill.stopped { color: var(--text-muted, currentColor); }
  .metrics { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: calc(12px * var(--text-scale, 1)); }
  .metric { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
  .metric span { overflow-wrap: anywhere; }
  .metric svg { width: 16px; height: 16px; flex: none; color: var(--accent, currentColor); }
  .metric.memory svg { color: var(--text-muted, currentColor); }
  .io { color: var(--text-muted, currentColor); font-size: calc(11px * var(--text-scale, 1)); }
  /* A card that can be acted on unfolds on a tap: its name, its state and one button per action. */
  .card.actionable { cursor: pointer; }
  .card.actionable:focus-visible { outline: 3px solid var(--accent, currentColor); outline-offset: 2px; }
  .card.open { border-color: var(--accent, currentColor); }
  .head { display: flex; align-items: center; gap: 8px; }
  .head .name { flex: 1; min-width: 0; }
  .head .pill { flex: none; max-width: 50%; margin: 0; }
  .actions { display: flex; gap: 6px; margin-top: 6px; }
  .actions button {
    flex: 1;
    min-width: 0;
    min-height: 56px;
    padding: 4px 8px;
    border: 1px solid var(--border, currentColor);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: calc(14px * var(--text-scale, 1));
    font-weight: 650;
    cursor: pointer;
  }
  .actions button:focus-visible { outline: 3px solid var(--accent, currentColor); outline-offset: 2px; }
  .actions button.confirm { background: var(--danger, #e5484d); border-color: var(--danger, #e5484d); color: #fff; }
  .note {
    flex: 1;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: calc(13px * var(--text-scale, 1));
    color: var(--text-muted, currentColor);
  }
  .note.failed { color: var(--danger, currentColor); }
  html.on-light .filters button[aria-pressed="true"] {
    background: rgba(128, 128, 128, .2);
    color: var(--on-surface, #0b0d10);
  }
  html.accent-fill .summary, html.accent-fill .meta, html.accent-fill .io,
  html.accent-fill .pill, html.accent-fill .metric svg,
  html.accent-fill .note, html.accent-fill .note.failed { color: var(--on-surface); }
  html.accent-fill .card.open { border-color: var(--on-surface); }
  html.accent-fill .actions button.confirm {
    background: var(--on-surface);
    border-color: var(--on-surface);
    color: var(--accent);
  }
  html.accent-fill .filters button[aria-pressed="true"] {
    background: var(--on-surface);
    color: var(--accent);
    box-shadow: none;
  }
  html.accent-fill #filter-active::before, html.accent-fill #filter-stopped::before,
  html.accent-fill #filter-all::before { background: currentColor; }
  @media (max-height: 380px) {
    .wrap { padding: 7px; gap: 5px; }
    .card { padding: 6px 8px; }
    .io { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="filters" role="group" id="filters">
      <button type="button" id="filter-active" aria-pressed="true"></button>
      <button type="button" id="filter-stopped" aria-pressed="false"></button>
      <button type="button" id="filter-all" aria-pressed="false"></button>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="cards" id="list"></div>
</div>
<script>
  var L = {
    activeLabel: { fr: 'Actifs', en: 'Running' },
    stoppedLabel: { fr: 'Arrêtés', en: 'Stopped' },
    allLabel: { fr: 'Tous', en: 'All' },
    activeFilter: { fr: 'Actifs ({n})', en: 'Running ({n})' },
    stoppedFilter: { fr: 'Arrêtés ({n})', en: 'Stopped ({n})' },
    allFilter: { fr: 'Tous ({n})', en: 'All ({n})' },
    filterLabel: { fr: 'Filtrer les conteneurs', en: 'Filter containers' },
    loading: { fr: 'Chargement…', en: 'Loading…' },
    newerHost: { fr: 'Version plus récente de Fremkit nécessaire', en: 'Needs a newer Fremkit' },
    stale: { fr: 'Données anciennes', en: 'Stale data' },
    unavailable: { fr: 'Docker n’est pas installé', en: 'Docker is not installed' },
    offline: { fr: 'Docker ne fonctionne pas', en: 'Docker is not running' },
    invalid: { fr: 'Données Docker illisibles', en: 'Unreadable Docker data' },
    remote: { fr: 'Contexte Docker distant : suivi local désactivé', en: 'Remote Docker context: local monitoring disabled' },
    emptyActive: { fr: 'Aucun conteneur actif', en: 'No running containers' },
    emptyStopped: { fr: 'Aucun conteneur arrêté', en: 'No stopped containers' },
    emptyAll: { fr: 'Aucun conteneur', en: 'No containers' },
    counts: { fr: '{running} actifs / {total} conteneurs', en: '{running} running / {total} containers' },
    cpu: { fr: 'CPU', en: 'CPU' },
    memory: { fr: 'Mémoire', en: 'Memory' },
    network: { fr: 'Réseau cumulé', en: 'Total network I/O' },
    io: { fr: 'Disque cumulé', en: 'Total disk I/O' },
    stateRunning: { fr: 'Actif', en: 'Running' },
    stateExited: { fr: 'Arrêté', en: 'Stopped' },
    stateDead: { fr: 'Arrêté', en: 'Stopped' },
    stateCreated: { fr: 'Créé', en: 'Created' },
    statePaused: { fr: 'En pause', en: 'Paused' },
    stateRestarting: { fr: 'Redémarrage', en: 'Restarting' },
    stateRemoving: { fr: 'Suppression', en: 'Removing' },
    stateUnknown: { fr: 'État inconnu', en: 'Unknown state' },
    start: { fr: 'Démarrer', en: 'Start' },
    stop: { fr: 'Arrêter', en: 'Stop' },
    restart: { fr: 'Redémarrer', en: 'Restart' },
    confirm: { fr: 'Confirmer ?', en: 'Confirm?' },
    startPending: { fr: 'Démarrage…', en: 'Starting…' },
    stopPending: { fr: 'Arrêt…', en: 'Stopping…' },
    restartPending: { fr: 'Redémarrage…', en: 'Restarting…' },
    errBusy: { fr: 'Une action est déjà en cours', en: 'An action is already running' },
    errUnknown: { fr: 'Conteneur introuvable', en: 'Container not found' },
    errLocal: { fr: 'Réservé à ce Mac et aux appareils appairés', en: 'Only from this Mac or a paired device' },
    errFailed: { fr: 'L’action a échoué', en: 'The action failed' }
  }
  var ERRORS = {
    'busy': 'errBusy', 'unknown-container': 'errUnknown', 'local-only': 'errLocal',
    'remote-context': 'remote', 'unavailable': 'unavailable'
  }
  var CONFIRM_MS = 4000
  var FOLD_MS = 10000
  var FAILURE_MS = 4000
  var snapshot = null
  var filter = 'active'
  var olderHost = false
  var open = null          // id of the unfolded card
  var confirming = null    // the action of the unfolded card waiting for its second tap
  var pending = {}         // id -> the action under way
  var failure = null       // { id, key }: the last refusal, shown on its card for a moment
  var foldTimer = null
  var confirmTimer = null
  var failureTimer = null

  function t(key, params) { return Fremkit.t(L[key], params) }
  function esc(value) { return Fremkit.esc(value == null ? '' : value) }
  function byId(id) { return document.getElementById(id) }
  function isStopped(container) {
    return container.state === 'exited' || container.state === 'dead' || container.state === 'created'
  }
  function stateLabel(value) {
    var key = 'state' + value.charAt(0).toUpperCase() + value.slice(1)
    return t(L[key] ? key : 'stateUnknown')
  }
  function statusText() {
    if (!snapshot) return t(olderHost ? 'newerHost' : 'loading')
    var error = snapshot.error
    var message = error === 'remote-context' ? t('remote')
      : error && L[error] ? t(error) : ''
    return (snapshot.stale ? t('stale') : '') + (snapshot.stale && message ? ' · ' : '') + message
  }
  function metric(kind, value) {
    var label = t(kind)
    var path = kind === 'cpu'
      ? '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4M18 9h4m-4 6h4"/>'
      : '<rect x="2" y="6" width="20" height="11" rx="2"/><path d="M6 10v3m4-3v3m4-3v3m4-3v3m4-3v3m4-3v3"/>'
    return '<span class="metric ' + kind + '" role="img" title="' + esc(label)
      + '" aria-label="' + esc(label + ' : ' + value) + '"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
      + path + '</svg><span>' + esc(value) + '</span></span>'
  }
  // What this host can do to a container in that state. A Fremkit older than the commands
  // publishes no `actions`: no card unfolds there and the widget stays read-only.
  function actionsFor(container) {
    var offered = snapshot && snapshot.data && Array.isArray(snapshot.data.actions) ? snapshot.data.actions : []
    var wanted = container.state === 'running' || container.state === 'paused' || container.state === 'restarting'
      ? ['stop', 'restart'] : isStopped(container) ? ['start'] : []
    return wanted.filter(function (action) { return offered.indexOf(action) !== -1 })
  }
  function unfolded(container, actions, state, stateClass) {
    var html = '<div class="card actionable open" role="group" aria-label="' + esc(container.name)
      + '" data-id="' + esc(container.id) + '"><div class="head"><div class="name">' + esc(container.name)
      + '</div><div class="pill ' + stateClass + '">' + esc(state) + '</div></div><div class="actions">'
    if (pending[container.id]) {
      html += '<div class="note" role="status">' + esc(t(pending[container.id] + 'Pending')) + '</div>'
    } else if (failure && failure.id === container.id) {
      html += '<div class="note failed" role="alert">' + esc(t(failure.key)) + '</div>'
    } else {
      html += actions.map(function (action) {
        var asked = confirming === action
        return '<button type="button" data-act="' + action + '"' + (asked ? ' class="confirm"' : '') + '>'
          + esc(asked ? t('confirm') : t(action)) + '</button>'
      }).join('')
    }
    return html + '</div></div>'
  }
  function card(container) {
    var stats = container.stats
    var state = stateLabel(container.state)
    var stateClass = container.state === 'running' ? 'running' : 'stopped'
    var actions = actionsFor(container)
    if (open === container.id && (actions.length || pending[container.id])) return unfolded(container, actions, state, stateClass)
    var status = String(container.status || '').trim()
    var detail = status.toLowerCase() === container.state.toLowerCase() ? '' : ' · ' + esc(status)
    var html = (actions.length
      ? '<div class="card actionable" role="button" tabindex="0" aria-expanded="false" data-id="' + esc(container.id) + '">'
      : '<div class="card">')
      + '<div class="name">' + esc(container.name)
      + '</div><div class="meta">' + esc(container.image)
      + '</div><div class="pill ' + stateClass + '">' + esc(state) + detail
      + '</div><div class="metrics">' + metric('cpu', stats ? stats.cpu : '?')
      + metric('memory', stats ? stats.memory : '?') + '</div>'
    if (stats) {
      html += '<div class="io">' + esc(t('network')) + ': ' + esc(stats.netIO)
        + ' · ' + esc(t('io')) + ': ' + esc(stats.blockIO) + '</div>'
    }
    return html + '</div>'
  }
  function render() {
    document.documentElement.lang = Fremkit.locale
    var rows = snapshot && snapshot.data ? snapshot.data.containers : []
    var running = rows.filter(function (container) { return container.state === 'running' })
    var stopped = rows.filter(isStopped)
    var remote = snapshot && snapshot.error === 'remote-context' && !snapshot.data
    byId('status').textContent = statusText()
    byId('summary').textContent = snapshot && snapshot.data
      ? t('counts', { running: running.length, total: rows.length }) : ''
    byId('filters').hidden = !!remote
    byId('filter-active').textContent = snapshot && snapshot.data ? t('activeFilter', { n: running.length }) : t('activeLabel')
    byId('filter-stopped').textContent = snapshot && snapshot.data ? t('stoppedFilter', { n: stopped.length }) : t('stoppedLabel')
    byId('filter-all').textContent = snapshot && snapshot.data ? t('allFilter', { n: rows.length }) : t('allLabel')
    byId('filters').setAttribute('aria-label', t('filterLabel'))
    for (var key of ['active', 'stopped', 'all']) {
      byId('filter-' + key).setAttribute('aria-pressed', String(filter === key))
    }
    var visible = filter === 'active' ? running : filter === 'stopped' ? stopped : rows
    // The unfolded container left the list (stopped under "Running", removed): nothing stays open.
    if (open && !pending[open] && !visible.some(function (container) { return container.id === open })) {
      open = null
      confirming = null
    }
    byId('empty').hidden = !snapshot || !snapshot.data || visible.length > 0
    byId('empty').textContent = t(filter === 'active' ? 'emptyActive' : filter === 'stopped' ? 'emptyStopped' : 'emptyAll')
    byId('list').innerHTML = visible.slice().sort(function (a, b) {
      return (b.state === 'running') - (a.state === 'running') || a.name.localeCompare(b.name)
    }).map(card).join('')
  }
  // The unfolded card folds back by itself: a Stop button is not left waiting on a touch screen.
  function arm() {
    clearTimeout(foldTimer)
    if (!open) return
    foldTimer = setTimeout(function () {
      if (pending[open]) { arm(); return }
      open = null
      confirming = null
      render()
    }, FOLD_MS)
  }
  function toggle(id) {
    if (pending[id]) return
    open = open === id ? null : id
    confirming = null
    failure = null
    clearTimeout(confirmTimer)
    arm()
    render()
  }
  function fail(id, code) {
    failure = { id: id, key: ERRORS[code] || 'errFailed' }
    clearTimeout(failureTimer)
    failureTimer = setTimeout(function () { failure = null; render() }, FAILURE_MS)
  }
  // Start goes at once. Stop and Restart take a second tap on the same button, within a few seconds.
  function press(id, action) {
    if (pending[id]) return
    arm()
    if (action !== 'start' && confirming !== action) {
      confirming = action
      clearTimeout(confirmTimer)
      confirmTimer = setTimeout(function () { confirming = null; render() }, CONFIRM_MS)
      render()
      return
    }
    confirming = null
    clearTimeout(confirmTimer)
    pending[id] = action
    render()
    Fremkit.sendCommand('docker-local', action, { id: id }).then(function (result) {
      delete pending[id]
      if (result && result.ok) { if (open === id) open = null } else fail(id, result && result.error)
    }, function () {
      // The host refused the command itself: not granted, or the page lost its server.
      delete pending[id]
      fail(id)
    }).then(function () { arm(); render() })
  }
  Fremkit.whenReady(function () {
    byId('list').addEventListener('click', function (event) {
      var cardEl = event.target.closest('.card[data-id]')
      if (!cardEl) return
      var button = event.target.closest('button[data-act]')
      if (button) press(cardEl.getAttribute('data-id'), button.getAttribute('data-act'))
      else toggle(cardEl.getAttribute('data-id'))
    })
    byId('list').addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && open) { toggle(open); return }
      if ((event.key !== 'Enter' && event.key !== ' ') || !event.target.matches('.card[data-id]')) return
      event.preventDefault()
      toggle(event.target.getAttribute('data-id'))
    })
    for (var key of ['active', 'stopped', 'all']) {
      (function (selected) {
        byId('filter-' + selected).addEventListener('click', function () { filter = selected; render() })
      })(key)
    }
    Fremkit.subscribe('docker-local', function (data) { snapshot = data; render() })
    Fremkit.onLocale(render)
    setTimeout(function () { if (!snapshot) { olderHost = true; render() } }, 20000)
    render()
  })
</script>
</body>
</html>
